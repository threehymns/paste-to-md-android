name: Release

on:
  push:
    branches:
      - main
    paths:
      - 'app/build.gradle.kts'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      versionName:
        description: 'Override versionName (e.g. 0.0.6). Defaults to tag name without leading v, or app/build.gradle.kts.'
        required: false
        default: ''
      versionCode:
        description: 'Override versionCode (positive integer). Defaults to app/build.gradle.kts.'
        required: false
        default: ''
      publishRelease:
        description: 'Publish a GitHub Release for this manual run'
        type: boolean
        required: false
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    name: Check version bump
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.version.outputs.should_release }}
      publish_release: ${{ steps.version.outputs.publish_release }}
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
      release_tag: ${{ steps.version.outputs.release_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check version bump and resolve release metadata
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          INPUT_VERSION_NAME: ${{ inputs.versionName }}
          INPUT_VERSION_CODE: ${{ inputs.versionCode }}
          INPUT_PUBLISH_RELEASE: ${{ inputs.publishRelease }}
        run: |
          set -e

          extract_version_name() {
            sed -nE 's/^[[:space:]]*versionName[[:space:]]*=.*[=:][[:space:]]*"([^"]+)"[[:space:]]*$/\1/p' | head -n 1
          }
          extract_version_code() {
            sed -nE 's/^[[:space:]]*versionCode[[:space:]]*=.*[=:][[:space:]]*([0-9]+)[[:space:]]*$/\1/p' | head -n 1
          }

          GRADLE_VERSION_NAME=$(extract_version_name < app/build.gradle.kts)
          GRADLE_VERSION_CODE=$(extract_version_code < app/build.gradle.kts)

          if [ -n "$INPUT_VERSION_NAME" ]; then
            VERSION_NAME="$INPUT_VERSION_NAME"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
          else
            VERSION_NAME="$GRADLE_VERSION_NAME"
          fi

          if [ -n "$INPUT_VERSION_CODE" ]; then
            VERSION_CODE="$INPUT_VERSION_CODE"
          else
            VERSION_CODE="$GRADLE_VERSION_CODE"
          fi

          test -n "$VERSION_NAME" || { echo "::error::Failed to resolve versionName from app/build.gradle.kts."; exit 1; }
          test -n "$VERSION_CODE" || { echo "::error::Failed to resolve versionCode from app/build.gradle.kts."; exit 1; }

          SHOULD_RELEASE="false"
          PUBLISH_RELEASE="false"
          RELEASE_TAG="v${VERSION_NAME}"

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            SHOULD_RELEASE="true"
            if [ "$INPUT_PUBLISH_RELEASE" = "true" ]; then
              PUBLISH_RELEASE="true"
              if git rev-parse -q --verify "refs/tags/${RELEASE_TAG}" >/dev/null; then
                RELEASE_TAG="v${VERSION_NAME}-b${VERSION_CODE}"
              fi
            fi
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            SHOULD_RELEASE="true"
            PUBLISH_RELEASE="true"
            RELEASE_TAG="$GITHUB_REF_NAME"
          else
            # Push to main touching app/build.gradle.kts: trigger only when versionCode strictly increases.
            OLD_CODE=""
            if [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] && git cat-file -e "${BEFORE_SHA}:app/build.gradle.kts" 2>/dev/null; then
              OLD_CODE=$(git show "${BEFORE_SHA}:app/build.gradle.kts" | extract_version_code)
            elif git cat-file -e "HEAD~1:app/build.gradle.kts" 2>/dev/null; then
              OLD_CODE=$(git show "HEAD~1:app/build.gradle.kts" | extract_version_code)
            fi
            OLD_CODE="${OLD_CODE:-0}"

            echo "versionCode comparison: previous=${OLD_CODE}, current=${VERSION_CODE}"
            if [ "$VERSION_CODE" -gt "$OLD_CODE" ]; then
              SHOULD_RELEASE="true"
              PUBLISH_RELEASE="true"
              # Avoid overwriting an existing tag if versionName was not updated alongside versionCode.
              if git rev-parse -q --verify "refs/tags/${RELEASE_TAG}" >/dev/null; then
                RELEASE_TAG="v${VERSION_NAME}-b${VERSION_CODE}"
              fi
            else
              echo "Skipping release: versionCode did not increase (${OLD_CODE} -> ${VERSION_CODE})."
            fi
          fi

          {
            echo "should_release=${SHOULD_RELEASE}"
            echo "publish_release=${PUBLISH_RELEASE}"
            echo "version_name=${VERSION_NAME}"
            echo "version_code=${VERSION_CODE}"
            echo "release_tag=${RELEASE_TAG}"
          } >> "$GITHUB_OUTPUT"
          echo "Decision: should_release=${SHOULD_RELEASE} publish_release=${PUBLISH_RELEASE} versionName=${VERSION_NAME} versionCode=${VERSION_CODE} tag=${RELEASE_TAG}"

  release:
    name: Build signed release & publish
    needs: check
    if: needs.check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION_NAME: ${{ needs.check.outputs.version_name }}
      VERSION_CODE: ${{ needs.check.outputs.version_code }}
      RELEASE_TAG: ${{ needs.check.outputs.release_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare environment and release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          # Ensure .env file exists for Secrets Gradle plugin
          touch .env

          KEYSTORE_PATH="${KEYSTORE_PATH:-$GITHUB_WORKSPACE/my-upload-key.jks}"
          KEY_ALIAS="${KEY_ALIAS:-upload}"
          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"

          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 secret is not set."
            echo "::error::Encode your upload keystore with: base64 -w0 my-upload-key.jks"
            echo "::error::and add it as a GitHub Actions secret named RELEASE_KEYSTORE_BASE64,"
            echo "::error::along with STORE_PASSWORD, KEY_ALIAS (default: upload) and KEY_PASSWORD."
            exit 1
          fi
          if [ -z "$STORE_PASSWORD" ]; then
            echo "::error::STORE_PASSWORD secret is not set."
            exit 1
          fi
          if [ -z "$KEY_PASSWORD" ]; then
            echo "::error::KEY_PASSWORD secret is not set."
            exit 1
          fi

          echo "Restoring upload keystore..."
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"

          if [ ! -s "$KEYSTORE_PATH" ]; then
            echo "::error::Restored keystore is empty. Check RELEASE_KEYSTORE_BASE64 secret."
            exit 1
          fi
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null || {
            echo "::error::Keystore failed keytool validation. Check STORE_PASSWORD / KEY_ALIAS."
            exit 1
          }
          echo "Keystore validated (alias: $KEY_ALIAS)."

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        # Note: AGP only creates unit-test tasks for the debug build type by
        # default (testBuildType = "debug"), so testReleaseUnitTest does not
        # exist. Debug unit tests cover the same code.
        run: ./gradlew testDebugUnitTest --continue --no-configuration-cache

      - name: Build signed release (APK + AAB)
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ env.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --stacktrace --no-configuration-cache -PversionName="$VERSION_NAME" -PversionCode="$VERSION_CODE"

      - name: Verify release artifacts
        run: |
          set -e
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          AAB=$(ls app/build/outputs/bundle/release/*.aab | head -n 1)
          echo "APK: $APK"
          echo "AAB: $AAB"
          ls -lh "$APK" "$AAB"
          test -s "$APK" || { echo "::error::Release APK is empty."; exit 1; }
          test -s "$AAB" || { echo "::error::Release AAB is empty."; exit 1; }
          file "$APK" "$AAB"
          unzip -t "$APK" | tail -n 5
          unzip -t "$AAB" | tail -n 5
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* 2>/dev/null | sort -V | tail -n 1)
          if [ -x "$BUILD_TOOLS/apksigner" ]; then
            "$BUILD_TOOLS/apksigner" verify --print-certs --verbose "$APK"
          else
            echo "apksigner not found, skipping signature verification."
          fi
          echo "APK=$APK" >> "$GITHUB_ENV"
          echo "AAB=$AAB" >> "$GITHUB_ENV"
          (cd "$(dirname "$APK")" && sha256sum "$(basename "$APK")") > checksums.txt
          (cd "$(dirname "$AAB")" && sha256sum "$(basename "$AAB")") >> checksums.txt
          cat checksums.txt

      - name: Upload release artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ env.VERSION_NAME }}-${{ env.VERSION_CODE }}
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            checksums.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        if: needs.check.outputs.publish_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          files: |
            ${{ env.APK }}
            ${{ env.AAB }}
            checksums.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
