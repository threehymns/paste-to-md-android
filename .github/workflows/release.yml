name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      versionName:
        description: 'Override versionName (e.g. 1.1.0). Defaults to tag name without leading v, or 1.0.'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build signed release & publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare environment and release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          # Ensure .env file exists for Secrets Gradle plugin
          touch .env

          KEYSTORE_PATH="${KEYSTORE_PATH:-$GITHUB_WORKSPACE/my-upload-key.jks}"
          KEY_ALIAS="${KEY_ALIAS:-upload}"
          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"

          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 secret is not set."
            echo "::error::Encode your upload keystore with: base64 -w0 my-upload-key.jks"
            echo "::error::and add it as a GitHub Actions secret named RELEASE_KEYSTORE_BASE64,"
            echo "::error::along with STORE_PASSWORD, KEY_ALIAS (default: upload) and KEY_PASSWORD."
            exit 1
          fi
          if [ -z "$STORE_PASSWORD" ]; then
            echo "::error::STORE_PASSWORD secret is not set."
            exit 1
          fi
          if [ -z "$KEY_PASSWORD" ]; then
            echo "::error::KEY_PASSWORD secret is not set."
            exit 1
          fi

          echo "Restoring upload keystore..."
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"

          if [ ! -s "$KEYSTORE_PATH" ]; then
            echo "::error::Restored keystore is empty. Check RELEASE_KEYSTORE_BASE64 secret."
            exit 1
          fi
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null || {
            echo "::error::Keystore failed keytool validation. Check STORE_PASSWORD / KEY_ALIAS."
            exit 1
          }
          echo "Keystore validated (alias: $KEY_ALIAS)."

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Resolve versionName and versionCode
        env:
          INPUT_VERSION_NAME: ${{ inputs.versionName }}
        run: |
          set -e
          if [ -n "$INPUT_VERSION_NAME" ]; then
            VERSION_NAME="$INPUT_VERSION_NAME"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
          else
            VERSION_NAME="0.0.1"
          fi
          # GITHUB_RUN_NUMBER is monotonic per workflow and safe as versionCode.
          VERSION_CODE="$GITHUB_RUN_NUMBER"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "Building release versionName=$VERSION_NAME versionCode=$VERSION_CODE"

      - name: Run unit tests
        # Note: AGP only creates unit-test tasks for the debug build type by
        # default (testBuildType = "debug"), so testReleaseUnitTest does not
        # exist. Debug unit tests cover the same code.
        run: ./gradlew testDebugUnitTest --continue --no-configuration-cache

      - name: Build signed release (APK + AAB)
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ env.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --stacktrace --no-configuration-cache -PversionName="$VERSION_NAME" -PversionCode="$VERSION_CODE"

      - name: Verify release artifacts
        run: |
          set -e
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          AAB=$(ls app/build/outputs/bundle/release/*.aab | head -n 1)
          echo "APK: $APK"
          echo "AAB: $AAB"
          ls -lh "$APK" "$AAB"
          test -s "$APK" || { echo "::error::Release APK is empty."; exit 1; }
          test -s "$AAB" || { echo "::error::Release AAB is empty."; exit 1; }
          file "$APK" "$AAB"
          unzip -t "$APK" | tail -n 5
          unzip -t "$AAB" | tail -n 5
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* 2>/dev/null | sort -V | tail -n 1)
          if [ -x "$BUILD_TOOLS/apksigner" ]; then
            "$BUILD_TOOLS/apksigner" verify --print-certs --verbose "$APK"
          else
            echo "apksigner not found, skipping signature verification."
          fi
          echo "APK=$APK" >> "$GITHUB_ENV"
          echo "AAB=$AAB" >> "$GITHUB_ENV"
          (cd "$(dirname "$APK")" && sha256sum "$(basename "$APK")") > checksums.txt
          (cd "$(dirname "$AAB")" && sha256sum "$(basename "$AAB")") >> checksums.txt
          cat checksums.txt

      - name: Upload release artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ env.VERSION_NAME }}-${{ env.VERSION_CODE }}
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            checksums.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.APK }}
            ${{ env.AAB }}
            checksums.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
